<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 体检中心管理后台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>体检中心</h1>
                <p>管理后台</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">账号</label>
                    <input type="text" id="username" name="username" placeholder="请输入账号" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-login">登录</button>
                </div>
            </form>
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
